services:
  postgres:
    image: postgres:16-alpine
    container_name: sponsorship_db
    environment:
      POSTGRES_DB: sponsorship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sponsorship_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sponsorship_db;Username=postgres;Password=postgres123
      - JwtSettings__Secret=SponsorshipWorkflow_SuperSecret_Key_2024_MinLength32Chars!
      - JwtSettings__Issuer=SponsorshipWorkflow.API
      - JwtSettings__Audience=SponsorshipWorkflow.Client
      - JwtSettings__ExpiryMinutes=5
      - AllowedOrigins__0=http://localhost
      - AllowedOrigins__1=http://frontend
    ports:
      - "5001:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./sponsorship-app
      dockerfile: Dockerfile
    container_name: sponsorship_frontend
    environment:
      - API_URL=http://api:80
    ports:
      - "80:80"
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
