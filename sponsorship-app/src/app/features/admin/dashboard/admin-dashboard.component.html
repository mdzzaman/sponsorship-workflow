<app-shell [navItems]="navItems">
  <mat-tab-group>

    <mat-tab label="All Requests">
      <mat-card class="tab-card">
        <table mat-table [dataSource]="requests" class="full-width">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let r">{{ r.title }}</td>
          </ng-container>
          <ng-container matColumnDef="requestor">
            <th mat-header-cell *matHeaderCellDef>Requestor</th>
            <td mat-cell *matCellDef="let r">{{ r.requestorName }}</td>
          </ng-container>
          <ng-container matColumnDef="dept">
            <th mat-header-cell *matHeaderCellDef>Dept</th>
            <td mat-cell *matCellDef="let r">{{ r.department }}</td>
          </ng-container>
          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let r">MYR {{ r.requestedAmount | number:'1.2-2' }}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let r"><app-status-badge [status]="r.status"></app-status-badge></td>
          </ng-container>
          <ng-container matColumnDef="created">
            <th mat-header-cell *matHeaderCellDef>Created</th>
            <td mat-cell *matCellDef="let r">{{ r.createdAt | date:'dd MMM y' }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>History</th>
            <td mat-cell *matCellDef="let r">
              <button mat-icon-button (click)="router.navigate(['/admin/detail', r.id])" matTooltip="View History">
                <mat-icon>history</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="reqCols"></tr>
          <tr mat-row *matRowDef="let row; columns: reqCols;"></tr>
        </table>
        <p *ngIf="requests.length === 0" class="empty">No requests found.</p>
      </mat-card>
    </mat-tab>

    <mat-tab label="Manage Sponsorship Types">
      <div class="types-layout">
        <mat-card class="add-type-card">
          <mat-card-header>
            <mat-card-title>Add New Type</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <form [formGroup]="typeForm" (ngSubmit)="createType()">
              <mat-form-field appearance="outline" class="full-width type-field">
                <mat-label>Type Name</mat-label>
                <input matInput formControlName="name">
                <mat-error>Required</mat-error>
              </mat-form-field>
              <button mat-raised-button color="primary" type="submit">Add Type</button>
            </form>
          </mat-card-content>
        </mat-card>

        <mat-card class="types-list-card">
          <mat-card-header>
            <mat-card-title>Sponsorship Types</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <table mat-table [dataSource]="types" class="full-width">
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let t">{{ t.name }}</td>
              </ng-container>
              <ng-container matColumnDef="active">
                <th mat-header-cell *matHeaderCellDef>Active</th>
                <td mat-cell *matCellDef="let t">
                  <mat-slide-toggle [checked]="t.isActive" (change)="toggleType(t, $event.checked)"></mat-slide-toggle>
                </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="['name', 'active']"></tr>
              <tr mat-row *matRowDef="let row; columns: ['name', 'active'];"></tr>
            </table>
          </mat-card-content>
        </mat-card>
      </div>
    </mat-tab>

  </mat-tab-group>
</app-shell>
