<app-shell [navItems]="navItems">
  <h2>Finance Review Queue</h2>

  <mat-card>
    <table mat-table [dataSource]="requests" class="full-width">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let r">{{ r.title }}</td>
      </ng-container>
      <ng-container matColumnDef="requestor">
        <th mat-header-cell *matHeaderCellDef>Requestor</th>
        <td mat-cell *matCellDef="let r">{{ r.requestorName }}</td>
      </ng-container>
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let r">{{ r.sponsorshipTypeName }}</td>
      </ng-container>
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let r">MYR {{ r.requestedAmount | number:'1.2-2' }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r"><app-status-badge [status]="r.status"></app-status-badge></td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button (click)="router.navigate(['/finance/detail', r.id])" matTooltip="View">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-raised-button color="primary" (click)="approve(r)" class="action-btn">Approve</button>
          <button mat-raised-button color="warn" (click)="reject(r)">Reject</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
    @if (requests.length === 0) {
      <p class="empty">No items pending finance review.</p>
    }
  </mat-card>
</app-shell>
