<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sponsorship Workflow</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="you@example.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading" class="full-width">
          <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
          <span *ngIf="!loading">Sign In</span>
        </button>
      </form>
    </mat-card-content>
    <mat-card-footer>
      <div class="test-accounts">
        <small>
          <strong>Test accounts:</strong>
          requestor&#64;test.com / manager&#64;test.com / finance&#64;test.com / admin&#64;test.com
          (password: Test&#64;123!)
        </small>
      </div>
    </mat-card-footer>
  </mat-card>
</div>
