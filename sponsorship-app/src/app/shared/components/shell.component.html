<mat-sidenav-container class="shell-container">

  <mat-sidenav mode="side" opened class="sidenav">

    <div class="sidenav-brand">
      <div class="brand-logo">
        <mat-icon>business_center</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-name">SponsorFlow</span>
        <span class="brand-sub">Workflow System</span>
      </div>
    </div>

    <nav class="sidenav-nav">
      <p class="nav-section-label">Navigation</p>
      <mat-nav-list>
        @for (item of navItems; track item.route) {
          <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>

    <div class="sidenav-footer">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-meta">
        <span class="user-name">{{ auth.currentUser()?.fullName }}</span>
        <span class="user-role">{{ auth.currentUser()?.roles?.[0] }}</span>
      </div>
    </div>

  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <button mat-icon-button (click)="auth.logout()" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </header>

    <main class="page-content">
      <ng-content></ng-content>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
